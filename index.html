:root{--bg:#12141a;--panel:#1a1d26;--panel2:#20242f;--line:#2e3344;--ink:#ebe6da;--mute:#8f96a8;--gold:#d9b76a;--gold2:#f3e2a9}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat','Hiragino Sans','Yu Gothic','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK JP','Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.5}
header{max-width:1120px;margin:0 auto;padding:18px 16px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:'Marcellus',serif;font-size:30px;letter-spacing:.32em;color:var(--gold);line-height:1}
.tag{font-size:11px;color:var(--mute);letter-spacing:.08em;margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:12px;color:var(--mute);letter-spacing:.06em}
.seg button[aria-pressed=true]{background:var(--gold);color:#1b1608;font-weight:500}
.app{max-width:1120px;margin:0 auto;padding:12px 16px 60px;display:grid;grid-template-columns:minmax(300px,500px) 1fr;gap:24px;align-items:start}
.pv{position:sticky;top:12px}
.cvw{width:min(100%,calc((100vh - 340px)*.8));min-width:280px;margin:0 auto}
.pv canvas{display:block;width:100%;aspect-ratio:4/5;border-radius:3px;box-shadow:0 10px 40px rgba(0,0,0,.55);touch-action:none;cursor:grab;background:#000}
.pv canvas.drag{cursor:grabbing}
.pvhint{font-size:11px;color:var(--mute);margin-top:8px;text-align:center}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.sec h2{font-size:12px;font-weight:500;letter-spacing:.22em;color:var(--gold);margin-bottom:12px;text-transform:uppercase}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.f:last-child{margin-bottom:0}
.f>span,.lbl{font-size:11px;color:var(--mute);letter-spacing:.06em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;outline:none;min-width:0}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:76px;line-height:1.55}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input[type=range]{width:100%;accent-color:var(--gold)}
.btn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink);background:var(--panel2);letter-spacing:.04em}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:500;width:100%;padding:13px;font-size:14px;letter-spacing:.1em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{font-size:11px;color:var(--mute)}
.warn{color:#e89a8a}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.chip{all:unset;cursor:pointer;box-sizing:border-box;width:100%;text-align:center;padding:7px 2px;border:1px solid var(--line);border-radius:5px;font-size:12px;letter-spacing:.06em;color:#727a8d;background:var(--panel2)}
.chip[aria-pressed=true]{color:#f6ecc4;border-color:var(--gold);background:#2a2618}
.suits{display:flex;gap:8px}
.suit{all:unset;cursor:pointer;width:46px;height:46px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#8f96a8;background:var(--panel2)}
.suit svg{width:20px;height:24px}
.suit[aria-pressed=true]{color:var(--gold);border-color:var(--gold);background:#2a2618}
.sw{display:flex;gap:10px}
.sw button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg)}
.jt{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.jth{font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}
.jtg{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:2px 10px;font-size:11px;color:var(--gold);line-height:1.6}
.jtg b{font-weight:500;letter-spacing:.06em;display:inline-block;min-width:3.1em}
.sw .cu{background:conic-gradient(#f44,#fa4,#ee4,#4d4,#4dd,#44f,#d4d,#f44)}
.wheelbox{display:flex;gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap}
#wheel{width:220px;height:220px;touch-action:none;cursor:crosshair}
.wctl{display:flex;flex-direction:column;gap:8px;width:120px}
.chipc{width:100%;height:40px;border-radius:6px;border:1px solid var(--line)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:16px;max-width:min(92vw,440px);width:100%}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog img{width:100%;border-radius:3px;display:block;margin-bottom:12px;-webkit-touch-callout:default}
dialog .row{justify-content:space-between}
.hide{display:none!important}
@media(max-width:860px){.app{grid-template-columns:1fr}.pv{position:static;max-width:520px;margin:0 auto;width:100%}}
</style>
</head>
<body>
<header>
  <div><div class="logo">COURT</div><div class="tag" data-i="tag"></div></div>
  <div class="seg" id="langSeg"><button data-l="ja">日本語</button><button data-l="en">English</button><button data-l="ko">한국어</button></div>
</header>

<div class="app">
  <div class="pv">

    <div class="pvhint" data-i="pvhint"></div>
    <div class="jt" id="jt"></div>
  </div>

  <div class="ctl">
    <div class="sec">
      <h2 data-i="secImg"></h2>
      <div class="row" style="margin-bottom:12px">
        <div class="btn file"><span data-i="pick"></span><input type="file" id="file" accept="image/*"></div>
        <button class="btn" id="resetPos" data-i="resetPos"></button>
      </div>
      <label class="f"><span data-i="zoom"></span><input type="range" id="zoom" min="100" max="400" value="100"></label>
    </div>

    <div class="sec">
      <h2 data-i="secDesign"></h2>
      <div class="f"><span class="lbl" data-i="type"></span>
        <div class="seg" id="typeSeg" style="align-self:flex-start"><button data-t="A" data-i="classic"></button><button data-t="B" data-i="modern"></button></div></div>
      <div class="f"><span class="lbl" data-i="color"></span><div class="sw" id="sw"></div>
        <div class="wheelbox hide" id="wheelBox"><canvas id="wheel" width="440" height="440"></canvas>
          <div class="wctl"><span class="lbl">HEX</span><input type="text" id="hex" maxlength="7" autocomplete="off" spellcheck="false"><div class="chipc" id="hexChip"></div></div></div></div>
      <label class="f"><span data-i="density"></span><input type="range" id="den" min="0" max="100" value="65"></label>
    </div>

    <div class="sec">
      <h2 data-i="secBasic"></h2>
      <label class="f"><span data-i="name"></span><input type="text" id="name" maxlength="40" autocomplete="off"></label>
      <label class="f"><span data-i="race"></span><select id="race"></select></label>
      <div class="g2">
        <label class="f"><span data-i="dc"></span><select id="dc"></select></label>
        <label class="f"><span data-i="server"></span><select id="server"></select></label>
      </div>
      <div class="g2 hide" id="customWrap">
        <label class="f"><span data-i="dcFree"></span><input type="text" id="dcFree" maxlength="24" autocomplete="off"></label>
        <label class="f"><span data-i="serverFree"></span><input type="text" id="serverFree" maxlength="24" autocomplete="off"></label>
      </div>
    </div>

    <div class="sec">
      <h2 data-i="secJob"></h2>
      <label class="f"><span data-i="mainJob"></span><select id="mainJob"></select></label>
      <div class="f">
        <span class="lbl" data-i="subJobs"></span>
        <div class="chips" id="chips"></div>
        <div class="row" style="margin-top:4px"><button class="btn" id="allOn" data-i="allOn" style="padding:5px 12px;font-size:12px"></button><button class="btn" id="allOff" data-i="allOff" style="padding:5px 12px;font-size:12px"></button></div>
      </div>
    </div>

    <div class="sec">
      <h2 data-i="secCard"></h2>
      <div class="g2">
        <label class="f"><span data-i="num"></span><select id="lab"></select></label>
        <label class="f" id="numWrap"><span data-i="numFree"></span><input type="text" id="numIn" inputmode="numeric" maxlength="3" autocomplete="off"></label>
      </div>
      <div class="f"><span class="lbl" data-i="suit"></span><div class="suits" id="suits"></div></div>
      <label class="f"><span><span data-i="note"></span> <span id="noteWarn" class="warn hide" data-i="noteWarn"></span></span><textarea id="note" maxlength="240"></textarea></label>
    </div>

    <div class="sec">
      <h2 data-i="secExport"></h2>
      <div class="g2">
        <label class="f"><span data-i="size"></span><select id="size"></select></label>
        <label class="f"><span data-i="fmt"></span><select id="fmt"><option value="png">PNG</option><option value="jpg">JPEG</option></select></label>
      </div>
      <button class="btn pri" id="save" data-i="save"></button>
      <div class="mut" style="margin-top:8px" id="sizeNote"></div>
    </div>
  </div>
</div>

<dialog id="dlg">

 main:'',subs:new Set(),labSel:'custom',numIn:'100',suit:'s',note:T[LANG].sample,zoom:1,nx:.5,ny:.5,noteOverflow:false};
let noteIsSample=true,nameIsDefault=true;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============ image ============ */
const IMG={w:16,h:9,mips:[]};
function buildMips(src,w,h){
  const mips=[{c:src,w,h}];let cw=w,ch=h,cur=src;
  while(cw>160&&ch>160){const nw=Math.max(1,Math.round(cw/2)),nh=Math.max(1,Math.round(ch/2));const c=document.createElement('canvas');c.width=nw;c.height=nh;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,0,0,nw,nh);mips.push({c,w:nw,h:nh});cur=c;cw=nw;ch=nh;}
  return mips;
}
function setImage(img){
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const maxS=3000,k=Math.min(1,maxS/Math.max(w,h));
  let src=img;
  if(k<1){const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);src=c;w=c.width;h=c.height;}
  IMG.w=w;IMG.h=h;IMG.mips=buildMips(src,w,h);
  {const ar=w/h,bh=Math.max(125,100/ar);S.zmin=Math.min(1,100/(bh*ar),125/bh);$('zoom').min=Math.round(S.zmin*100);}
  S.zoom=1;S.nx=.5;S.ny=.5;$('zoom').value=100;
  cache.outer=cache.base=null;
  draw();
}
function rectFor(z,cover){
  const ar=IMG.w/IMG.h,bh=Math.max(125,100/ar),h=bh*z,w=h*ar;
  let x=50-S.nx*w,y=62.5-S.ny*h;
  if(cover){ /* background blur layers must always fill the card */
    x=w>=100?clamp(x,100-w,0):clamp(x,0,100-w);
    y=h>=125?clamp(y,125-h,0):clamp(y,0,125-h);
  }
  return {x,y,w,h};
}
const bgRect=()=>rectFor(S.zoom,false);

/* ============ canvas helpers ============ */
const HL=.21;
const GOLD=[[0,'#f3e2a9'],[.35,'#b8934a'],[.55,'#f6ecc4'],[.8,'#a67c37'],[1,'#e9d38f']];
const GG=[[0,'#f3e2a9'],[.4,'#b8934a'],[.6,'#f6ecc4'],[1,'#a67c37']];
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;};
function cssGrad(c,x,y,w,h,deg,stops){const a=deg*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a),L=Math.abs(w*dx)+Math.abs(h*dy),cx=x+w/2,cy=y+h/2;
  const g=c.createLinearGradient(cx-dx*L/2,cy-dy*L/2,cx+dx*L/2,cy+dy*L/2);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;}
function bboxGrad(c,x,y,w,h,stops){const g=c.createLinearGradient(x,y,x+w,y+h);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;}

const cache={outer:null,base:null,noise:null};
function drawImg(c,x,y,w,h,devW){
  let m=IMG.mips[0];
  for(const mm of IMG.mips){if(mm.w>=devW)m=mm;else break;}
  c.drawImage(m.c,x,y,w,h);
}
function drawScene(c,u,R,extra,k){
  c.save();
  if(extra!==1){c.translate(50*u,62.5*u);c.scale(extra,extra);c.translate(-50*u,-62.5*u);}
  drawImg(c,R.x*u,R.y*u,R.w*u,R.h*u,R.w*u*extra*k);
  c.restore();
}
function boxes(sigma,n){const wi=Math.sqrt(12*sigma*sigma/n+1);let wl=Math.floor(wi);if(wl%2===0)wl--;const wu=wl+2;const m=Math.round((12*sigma*sigma-n*wl*wl-4*n*wl-3*n)/(-4*wl-4));const s=[];for(let i=0;i<n;i++)s.push(i<m?wl:wu);return s;}
function blur1D(d,w,h,r,horiz){
  if(r<1)return;
  const n=horiz?w:h,lines=horiz?h:w,tmp=new Float32Array(n),win=2*r+1;
  for(let l=0;l<lines;l++){
    const idx=i=>{i=i<0?0:i>=n?n-1:i;return (horiz?(l*w+i):(i*w+l))*4;};
    for(let ch=0;ch<3;ch++){
      let sum=(r+1)*d[idx(0)+ch];for(let i=1;i<=r;i++)sum+=d[idx(i)+ch];
      for(let i=0;i<n;i++){tmp[i]=sum/win;sum+=d[idx(i+r+1)+ch]-d[idx(i-r)+ch];}
      for(let i=0;i<n;i++)d[idx(i)+ch]=tmp[i];
    }
  }
}
function blurLayer(kind,W,H,sigmaU,extra,R){
  const key=[W,R.x.toFixed(3),R.y.toFixed(3),R.w.toFixed(3),R.h.toFixed(3)].join('|');
  if(cache[kind]&&cache[kind].key===key)return cache[kind].cv;
  const u=W/100,sigma=sigmaU*u,k=Math.min(1,3/sigma);
  const sw=Math.max(8,Math.round(W*k)),sh=Math.max(10,Math.round(H*k));
  const cv=mk(sw,sh),c=cv.getContext('2d');c.imageSmoothingQuality='high';
  c.scale(sw/W,sh/H);drawScene(c,u,R,extra,sw/W);
  const id=c.getImageData(0,0,sw,sh),ss=sigma*k;
  for(const bw of boxes(Math.max(.5,ss),3)){const r=(bw-1)/2;blur1D(id.data,sw,sh,r,true);blur1D(id.data,sw,sh,r,false);}
  c.setTransform(1,0,0,1,0,0);c.putImageData(id,0,0);
  cache[kind]={key,cv};return cv;
}
function noiseLayer(W,H){
  if(cache.noise&&cache.noise.k===W)return cache.noise.cv;
  const nw=Math.round(W/1.2),nh=Math.round(H/1.2),cv=mk(nw,nh),c=cv.getContext('2d'),id=c.createImageData(nw,nh),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  c.putImageData(id,0,0);cache.noise={k:W,cv};return cv;
}

/* ---- text ---- */
const SERIF="'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP','Noto Serif JP','AppleMyungjo','Batang','Noto Serif CJK KR','Nanum Myeongjo',serif";
const SANS="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK JP','Noto Sans CJK KR','Noto Sans JP','Noto Sans KR',sans-serif";
const FAM={A:`'Marcellus',${SERIF}`,B:`'Italiana',${SERIF}`,sans:`'Montserrat',${SANS}`,num:`'CourtNum','Cormorant Garamond',Georgia,serif`};
function setF(c,w,px,fam){c.font=`${w} ${px}px ${fam}`;}
function baselineFor(c,top,lh){
  const m=c.measureText('Mg'),fa=m.fontBoundingBoxAscent,fd=m.fontBoundingBoxDescent;
  if(fa==null){const s=parseFloat(c.font.match(/([\d.]+)px/)[1]);return top+lh/2+s*.35;}
  return top+(lh-(fa+fd))/2+fa;
}
function tw(c,t,sp){if(!sp)return c.measureText(t).width;let w=0;for(const ch of t)w+=c.measureText(ch).width+sp;return w;}
function drawT(c,t,x,base,sp){c.textBaseline='alphabetic';c.textAlign='left';if(!sp){c.fillText(t,x,base);return;}for(const ch of t){c.fillText(ch,x,base);x+=c.measureText(ch).width+sp;}}
const symPath={};
function pathOf(key){return symPath[key]||(symPath[key]=new Path2D(SUIT[key]));}
function starPath(){if(symPath.star)return symPath.star;const p=new Path2D();STARPTS.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath();return symPath.star=p;}
function drawSym(c,key,x,y,w,h,color,star){
  c.save();c.translate(x,y);c.scale(w/100,h/120);c.fillStyle=color;
  if(star){const p=starPath();c.strokeStyle=color;c.lineWidth=4;c.lineJoin='round';c.fill(p);c.stroke(p);}
  else c.fill(pathOf(key));
  c.restore();
}

/* ---- card label ---- */
function resolveLabel(){
  if(S.labSel==='custom'){const v=(S.numIn||'').replace(/\D/g,'').slice(0,3);return v||'A';}
  return S.labSel;
}

/* ============ render ============ */
function render(cv,W){
  const H=Math.round(W*1.25),u=W/100,A=S.type==='A';
  cv.width=W;cv.height=H;
  const c=cv.getContext('2d');c.imageSmoothingQuality='high';
  const base=baseRGB(),d=S.density;
  const a0=.10+.0056*d,a1=Math.min(.96,.30+.0074*d),amid=(a0+a1)/2,tsa=.65*(1-d/100);
  const rgb=a=>`rgba(${base},${a})`;
  const R=bgRect(),Rc=rectFor(Math.max(S.zoom,1),true),m=2.8;
  const wx=m*u,wy=m*u,ww=(100-2*m)*u,wh=(125-2*m)*u;
  const label=resolveLabel(),isJ=label==='JOKER',suit=S.suit;

  /* 1 outer */
  c.drawImage(blurLayer('outer',W,H,2.2,1.08,Rc),0,0,W,H);
  c.fillStyle=rgb(.55);c.fillRect(0,0,W,H);
  c.save();c.globalAlpha=.10;c.strokeStyle='#fff';c.lineWidth=HL*u;c.beginPath();
  const P=3.4*Math.SQRT2*u;
  for(let x=-H;x<W+H;x+=P){c.moveTo(x,0);c.lineTo(x+H,H);}
  for(let x=0;x<W+H;x+=P){c.moveTo(x,0);c.lineTo(x-H,H);}
  c.stroke();c.restore();

  /* 2 window */
  c.save();c.beginPath();c.rect(wx,wy,ww,wh);c.clip();
  c.drawImage(blurLayer('base',W,H,3.6,1.1,Rc),0,0,W,H);
  if(A){c.fillStyle=rgb(amid);c.fillRect(wx,wy,ww,wh);}
  else{
    c.save();c.translate(50*u,57.724*u);c.scale(1,52/62);
    const g=c.createRadialGradient(0,0,0,0,0,62*u);g.addColorStop(0,rgb(a0));g.addColorStop(.35,rgb(a0));g.addColorStop(1,rgb(a1));
    c.fillStyle=g;c.fillRect(-300*u,-300*u,600*u,600*u);c.restore();
    c.save();c.globalCompositeOperation='overlay';c.globalAlpha=.10;c.drawImage(noiseLayer(W,H),0,0,W,H);c.restore();
  }

  /* ghost */
  {
    const fx=wx,fy=(125-m-28)*u,fw=ww,fh=28*u;
    c.save();c.beginPath();c.rect(fx,fy,fw,fh);c.clip();
    let bx,by,bw,bh;
    if(isJ){bw=38*u;bh=45.6*u;bx=fx+fw-bw;by=fy-2.6*u;}
    else{bw=42*u;bh=50*u;bx=fx+fw+2*u-bw;by=fy+fh+11*u-bh;}
    const sc=Math.min(bw/100,bh/120),ox=bx+(bw-100*sc)/2,oy=by+(bh-120*sc)/2;
    if(isJ&&A){
      const L=mk(100*sc+8*sc,120*sc),lc=L.getContext('2d');lc.translate(4*sc,0);lc.scale(sc,sc);
      const p=starPath();lc.fillStyle=lc.strokeStyle='#d9b76a';lc.lineWidth=4;lc.lineJoin='round';lc.fill(p);lc.stroke(p);
      c.globalAlpha=.1;c.drawImage(L,ox-4*sc,oy);c.globalAlpha=1;
    }else{
      c.save();c.translate(ox,oy);c.scale(sc,sc);
      const p=isJ?starPath():pathOf(suit);
      if(A){c.globalAlpha=.1;c.fillStyle='#d9b76a';c.fill(p);}
      else{c.globalAlpha=isJ?.32:.3;c.strokeStyle='#f6ecc4';c.lineWidth=HL*u/sc;c.lineJoin='round';c.stroke(p);}
      c.restore();
    }
    c.restore();
  }

  /* crisp */
  const bxx=wx,byy=(m+18.6)*u,bww=ww,bhh=68.2*u;
  {
    const L=mk(W,H),lc=L.getContext('2d');lc.imageSmoothingQuality='high';
    lc.beginPath();lc.rect(bxx,byy,bww,bhh);lc.clip();lc.beginPath();lc.ellipse(50*u,55.5*u,48.6*u,41*u,0,0,Math.PI*2);lc.clip();
    drawScene(lc,u,R,1,1);
    c.save();if(!A){c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=4*u;c.shadowOffsetY=.8*u;}
    c.drawImage(L,0,0);c.restore();
  }
  /* ring */
  c.save();c.beginPath();c.rect(bxx,byy,bww,bhh);c.clip();c.lineWidth=HL*u;
  const ell=(rx,ry)=>{c.beginPath();c.ellipse(50*u,55.5*u,rx*u,ry*u,0,0,Math.PI*2);};
  ell(48.6,41);c.strokeStyle=bboxGrad(c,(50-48.6)*u,(55.5-41)*u,97.2*u,82*u,GG);c.stroke();
  if(A){ell(50.6,43);c.globalAlpha=.4;c.strokeStyle=bboxGrad(c,(50-50.6)*u,(55.5-43)*u,101.2*u,86*u,GG);c.stroke();}
  else{
    c.globalAlpha=.5;c.strokeStyle='#d9b76a';c.beginPath();
    const cx=50,cy=55.5,rx=48.6,ry=41;
    for(let deg=0;deg<360;deg+=3){const t=deg*Math.PI/180,co=Math.cos(t),si=Math.sin(t);let nx=co/rx,ny=si/ry;const l=Math.hypot(nx,ny);nx/=l;ny/=l;
      const L=deg%15===0?1.9:.8,g=1.0,x0=cx+rx*co+nx*g,y0=cy+ry*si+ny*g;c.moveTo(x0*u,y0*u);c.lineTo((x0+nx*L)*u,(y0+ny*L)*u);}
    c.stroke();
  }
  c.restore();

  /* strips */
  const shadowOn=()=>{c.shadowColor=`rgba(0,0,0,${tsa})`;c.shadowBlur=1.4*u;};
  const shadowOff=()=>{c.shadowColor='transparent';c.shadowBlur=0;};
  function strip(groups,y0,lineAtBottom){
    const sh=4.6,cw=5.4,gap=0,cells=groups.reduce((a,g)=>a+g.length,0),total=cells*cw+(groups.length-1)*gap;
    let x=50-total/2;
    setF(c,500,(A?1.6:1.55)*u,FAM.sans);
    groups.forEach((g,gi)=>{
      if(gi)x+=gap;
      g.forEach((j,i)=>{
        const on=S.subs.has(j),al=on?1:.3,cxm=x+cw/2;
        if(!(gi===0&&i===0)){c.save();c.globalAlpha=.4*al;c.fillStyle='#d9b76a';c.fillRect(x*u,(y0+sh*.32)*u,HL*u,sh*.36*u);c.restore();}
        c.save();c.globalAlpha=al;c.fillStyle='#f6ecc4';shadowOn();
        const fs=(A?1.6:1.55)*u,sp=.1*fs,wd=tw(c,j,sp),base=baselineFor(c,(y0+sh/2)*u-fs/2,fs);
        drawT(c,j,cxm*u-wd/2,base,sp);c.restore();
        x+=cw;
      });
    });
    const ly=lineAtBottom?y0+sh-HL:y0;
    c.save();c.globalAlpha=.8;c.fillStyle=cssGrad(c,5.8*u,ly*u,88.4*u,HL*u,135,GOLD);c.fillRect(5.8*u,ly*u,88.4*u,HL*u);c.restore();
  }
  strip(TOP,m+14,true);
  strip(BOT,125-m-28-4.6,false);
  c.restore(); /* end window */

  /* frames */
  const frame=(ins,alpha)=>{c.save();c.globalAlpha=alpha;const x=ins*u,y=ins*u,w=W-2*ins*u,h=H-2*ins*u;c.strokeStyle=cssGrad(c,x,y,w,h,135,GOLD);c.lineWidth=HL*u;c.strokeRect(x+HL*u/2,y+HL*u/2,w-HL*u,h-HL*u);c.restore();};
  frame(1.2,A?.75:.5);frame(m,1);

  /* index */
  function idxBox(){
    const sz=isJ?3.5:(/^\d+$/.test(label)?(label.length>=3?5:label.length===2?6:7.2):(A?6.4:7));
    const fam=isJ?FAM[S.type]:(/^\d+$/.test(label)?FAM.num:FAM[S.type]);
    const wgt=isJ?400:(/^\d+$/.test(label)?500:400);
    setF(c,wgt,sz*u,fam);
    const sp=isJ?.14*sz*u:0,txt=isJ?'JOKER':label,lw=tw(c,txt,sp);
    const symW=A?6:3,symH=A?6:3.6;
    const w=Math.max(7*u,lw,symW*u),h=(sz+1+symH)*u;
    return {sz,fam,wgt,sp,txt,lw,symW,symH,w,h};
  }
  function drawIdx(pos){
    const b=idxBox();let ox,oy;
    c.save();
    if(pos==='tl'){ox=(m+3)*u;oy=(m+2.2)*u;}
    else{ox=W-(m+3)*u-b.w;oy=H-(m+2.2)*u-b.h;c.translate(ox+b.w/2,oy+b.h/2);c.rotate(Math.PI);c.translate(-(ox+b.w/2),-(oy+b.h/2));}
    setF(c,b.wgt,b.sz*u,b.fam);c.fillStyle='#f6ecc4';shadowOn();
    const tx=isJ?ox:ox+(b.w-b.lw)/2;
    drawT(c,b.txt,tx,baselineFor(c,oy,b.sz*u),b.sp);
    shadowOff();
    const sy=oy+(b.sz+1)*u,scx=isJ?ox+b.symW*u/2:ox+b.w/2;
    if(A){
      c.strokeStyle='rgba(217,183,106,.85)';c.lineWidth=HL*u;c.beginPath();c.arc(scx,sy+3*u,3*u-HL*u/2,0,Math.PI*2);c.stroke();
      drawSym(c,suit,scx-1.2*u,sy+(6-2.88)/2*u,2.4*u,2.88*u,'#d9b76a',isJ);
    }else drawSym(c,suit,scx-1.5*u,sy,3*u,3.6*u,'#f6ecc4',isJ);
    c.restore();
  }
  drawIdx('tl');drawIdx('br');

  /* header info */
  {
    let lines=[S.race,S.dc==='__c'?S.dcFree:S.dc,S.dc==='__c'?S.serverFree:S.server].map(s=>(s||'').trim()).filter(Boolean);
    if(!A)lines=lines.map(s=>s.toUpperCase());
    if(lines.length){
      const sz=A?2.1:1.85,sp=(A?.14:.32)*sz*u,gap=1.2,tot=lines.length*sz+(lines.length-1)*gap;
      let y=9.8-tot/2;
      lines.forEach((t,i)=>{
        setF(c,500,sz*u,FAM.sans);c.save();
        c.fillStyle=i===0?(A?'#f6ecc4':'#d9b76a'):'#f4efe2';c.globalAlpha=(!A&&i>0)?.9:1;shadowOn();
        const w=tw(c,t,sp)-sp;drawT(c,t,(100-7.3)*u-w,baselineFor(c,y*u,sz*u),sp);c.restore();
        y+=sz+gap;
      });
    }
  }

  /* footer info */
  {
    const x0=(m+6)*u,top=96.2*u,bot=119.8*u,items=[];
    const mainTxt=S.main&&JOBS[S.main]?JOBS[S.main][0].toUpperCase():'';
    if(mainTxt){const sz=A?1.7:1.55;items.push({h:sz,mb:A?1.3:1.1,draw:(y)=>{setF(c,500,sz*u,FAM.sans);c.fillStyle='#d9b76a';drawT(c,mainTxt,x0,baselineFor(c,y*u,sz*u),.6*sz*u);}});}
    const nm=(S.name||'').trim();
    if(nm){
      let sz=A?6:7.6;const sp0=.05;
      setF(c,400,sz*u,FAM[S.type]);const w0=tw(c,nm,sp0*sz*u)-sp0*sz*u,maxW=76*u;
      if(w0>maxW)sz=Math.max(2.6,sz*maxW/w0);
      const lh=sz*(A?1.05:1);
      items.push({h:lh,draw:(y)=>{setF(c,400,sz*u,FAM[S.type]);c.fillStyle='#f4efe2';drawT(c,nm,x0,baselineFor(c,y*u,lh*u),sp0*sz*u);}});
    }
    const noteLines=[];let over=false;
    if((S.note||'').trim()){
      const nsz=A?2:1.85,nsp=(A?.08:.1)*nsz*u,lhn=nsz*(A?1.7:1.8);
      setF(c,400,nsz*u,FAM.sans);
      const maxW=64.4*u;
      for(const raw of S.note.split('\n')){
        let cur='',cw=0;
        const chars=Array.from(raw);
        if(!chars.length){noteLines.push('');continue;}
        for(const ch of chars){
          const w=c.measureText(ch).width+nsp;
          if(cw+w>maxW&&cur){
            const sp=cur.lastIndexOf(' ');
            if(sp>0&&ch!==' '){noteLines.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}else{noteLines.push(cur);cur=ch==' '?'':ch;}
            cw=tw(c,cur,nsp);
          }else{cur+=ch;cw+=w;}
        }
        noteLines.push(cur);
      }
      over=noteLines.length>3;
      const shown=noteLines.slice(0,3);
      if(items.length)items.push({h:0,rule:true});
      items.push({h:lhn*shown.length,draw:(y)=>{setF(c,400,nsz*u,FAM.sans);c.save();c.globalAlpha=A?.92:.82;c.fillStyle='#f4efe2';
        shown.forEach((ln,i)=>drawT(c,ln,x0,baselineFor(c,(y+i*lhn)*u,lhn*u),nsp));c.restore();}});
    }
    S.noteOverflow=over;
    // heights
    const ruleW=A?18:11,rmt=1.8,rmb=A?1.6:1.5;
    let tot=0;items.forEach(it=>{tot+=it.rule?(rmt+HL+rmb):(it.h+(it.mb||0));});
    let y=(top+bot)/2/u-tot/2;
    c.save();shadowOn();
    items.forEach(it=>{
      if(it.rule){
        y+=rmt;c.save();c.shadowColor='transparent';c.globalAlpha=A?.8:.7;c.fillStyle=cssGrad(c,x0,y*u,ruleW*u,HL*u,135,GOLD);c.fillRect(x0,y*u,ruleW*u,HL*u);c.restore();y+=HL+rmb;
      }else{it.draw(y);y+=it.h+(it.mb||0);}
    });

  }

  /* copyright */
  {
    const sz=1.25;setF(c,400,sz*u,FAM.sans);c.save();c.globalAlpha=.6;c.fillStyle='#f4efe2';
    const sp=.2*sz*u,t='©SQUARE ENIX',w=tw(c,t,sp)-sp;drawT(c,t,50*u-w/2,baselineFor(c,121*u-sz*u/2,sz*u),sp);c.restore();

/* pan / zoom */
const ptrs=new Map();let pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.classList.add('drag');if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const rect=cv.getBoundingClientRect(),uPerPx=100/rect.width;
  if(ptrs.size===1){
    const R=bgRect();S.nx-=(e.clientX-p.x)*uPerPx/R.w;S.ny-=(e.clientY-p.y)*uPerPx/R.h;
    S.nx=clamp(S.nx,-30/R.w,1+30/R.w);S.ny=clamp(S.ny,-37.5/R.h,1+37.5/R.h);
    p.x=e.clientX;p.y=e.clientY;
  }else if(ptrs.size===2){
    p.x=e.clientX;p.y=e.clientY;const[a,b]=[...ptrs.values()],dd=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinch>0){setZoom(S.zoom*dd/pinch);}pinch=dd;
  }
  draw();
});
const endp=e=>{ptrs.delete(e.pointerId);if(!ptrs.size)cv.classList.remove('drag');pinch=0;};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);

function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return [Math.round(f(5)*255),Math.round(f(3)*255),Math.round(f(1)*255)];}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return {h,s:mx?d/mx:0,v:mx};}

/* color wheel */
const WR=220,WO=100,WI=80,WH=(WI-9)/Math.SQRT2;
function drawWheel(){
  const cw=$('wheel'),c=cw.getContext('2d'),k=cw.width/(2*WR+0),cx=cw.width/2,cy=cw.height/2,s=cw.width/220;
  c.clearRect(0,0,cw.width,cw.height);
  for(let a=0;a<360;a+=1){c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,WO*s,(a-1.2)*Math.PI/180,(a+1.2)*Math.PI/180);c.closePath();c.fillStyle=`hsl(${a},100%,50%)`;c.fill();}
  c.globalCompositeOperation='destination-out';c.beginPath();c.arc(cx,cy,WI*s,0,Math.PI*2);c.fill();c.globalCompositeOperation='source-over';
  const x0=cx-WH*s,y0=cy-WH*s,w=2*WH*s;
  let g=c.createLinearGradient(x0,0,x0+w,0);g.addColorStop(0,'#fff');g.addColorStop(1,`hsl(${S.cust.h},100%,50%)`);c.fillStyle=g;c.fillRect(x0,y0,w,w);
  g=c.createLinearGradient(0,y0,0,y0+w);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');c.fillStyle=g;c.fillRect(x0,y0,w,w);
  const ang=S.cust.h*Math.PI/180,rm=(WO+WI)/2*s;
  c.lineWidth=2.5*s;c.strokeStyle='#fff';c.shadowColor='rgba(0,0,0,.6)';c.shadowBlur=3*s;
  c.beginPath();c.arc(cx+rm*Math.cos(ang),cy+rm*Math.sin(ang),6*s,0,Math.PI*2);c.stroke();
  c.beginPath();c.arc(x0+S.cust.s*w,y0+(1-S.cust.v)*w,6*s,0,Math.PI*2);c.stroke();c.shadowBlur=0;
  $('hexChip').style.background=custHex();$('hex').value!==custHex()&&document.activeElement!==$('hex')&&($('hex').value=custHex());
}
(function(){
  const cw=$('wheel');let mode='';
  function pos(e){const r=cw.getBoundingClientRect();return [(e.clientX-r.left)*220/r.width-110,(e.clientY-r.top)*220/r.height-110];}
  function apply(e){
    const [x,y]=pos(e);
    if(mode==='h'){S.cust.h=(Math.atan2(y,x)*180/Math.PI+360)%360;}
    else if(mode==='sv'){S.cust.s=clamp((x+WH)/(2*WH),0,1);S.cust.v=1-clamp((y+WH)/(2*WH),0,1);}
    drawWheel();draw();
  }
  cw.addEventListener('pointerdown',e=>{const [x,y]=pos(e),d=Math.hypot(x,y);
    if(d>=WI-4&&d<=WO+6)mode='h';else if(Math.abs(x)<=WH+4&&Math.abs(y)<=WH+4)mode='sv';else return;
    cw.setPointerCapture(e.pointerId);apply(e);});
  cw.addEventListener('pointermove',e=>{if(mode)apply(e);});
  const up=()=>{mode='';};cw.addEventListener('pointerup',up);cw.addEventListener('pointercancel',up);
  $('hex').addEventListener('input',e=>{const m=/^#?([0-9a-f]{6})$/i.exec(e.target.value.trim());if(!m)return;const n=parseInt(m[1],16);S.cust=rgb2hsv(n>>16,(n>>8)&255,n&255);drawWheel();draw();});
})();
